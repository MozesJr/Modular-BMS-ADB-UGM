# MQTT/config/mosquitto.conf
# Kontrak payload/topik: docs/MQTT-CONTRACT.md. Penjelasan operasional: MQTT/README.md.

listener 1883
protocol mqtt

# --- Auth ---
allow_anonymous false
allow_zero_length_clientid false
# password_file TIDAK ada di repo: dibuat oleh MQTT/scripts/init-passwd.sh dan di-mount dari MQTT/secrets/ (lihat README).
password_file /mosquitto/secrets/password_file

# --- Batas (melindungi broker dari klien rusak/berbahaya) ---
# Sesuai kontrak MQTT: payload maks 65.536 byte.
message_size_limit 65536
max_connections 200
max_queued_messages 1000
max_inflight_messages 20
# Klien yang meminta keepalive lebih besar dari ini ditolak/di-override (MQTT v5). ESP32 umumnya 15-60 dtk.
max_keepalive 300
# Buang sesi persisten klien yang tidak pernah kembali.
persistent_client_expiration 7d

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging (dipersempit: tanpa level information yang sangat verbose) ---
log_dest stdout
log_type error
log_type warning
log_type notice
