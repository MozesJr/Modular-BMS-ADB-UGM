# MQTT/config.dev/mosquitto.conf — HANYA untuk dev lokal (docker-compose.dev.yml).
# Prod (MQTT/config/mosquitto.conf) TIDAK diubah. Anonymous diizinkan agar simulator &
# backend dev bisa connect tanpa kredensial.
listener 1883
protocol mqtt

allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
