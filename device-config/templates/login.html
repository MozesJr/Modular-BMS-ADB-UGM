{% extends "base.html" %}
{% block body %}
<header><h1>{{ S.AP_SSID }}</h1></header>
<section>
  <h2>Masuk</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autofocus required>
    <p class="hint">Password awal sama dengan password hotspot alat (tampil di layar alat saat mode setup).</p>
    <button>Masuk</button>
  </form>
</section>
{% endblock %}
