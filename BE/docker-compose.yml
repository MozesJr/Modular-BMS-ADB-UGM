# BE/docker-compose.yml
#
# Tidak ada service Postgres/Mosquitto lokal di sini — BE connect ke:
#   - master_postgresql (container Postgres yang sudah jalan di VPS, project "master_db")
#   - bms_mosquitto     (container Mosquitto yang sudah jalan di VPS, project "master_db")
# lewat network eksternal "master-db-network" (lihat MASTER_DB_NETWORK di bawah).
services:
  backend:
    build: .
    image: bms-backend:local
    container_name: bms-backend
    env_file:
      - .env.production
    networks:
      - bms-network
      - master-db-network
    restart: unless-stopped
    # BE tidak perlu diexpose ke publik (FE yang jadi entry point, proxy internal via rewrites()).
    # Buka port ini hanya untuk debugging lokal di VPS, dan hanya ke loopback:
    # ports:
    #   - "127.0.0.1:4000:4000"

networks:
  bms-network:
    external: true
  master-db-network:
    external: true
    # Isi MASTER_DB_NETWORK di root .env (lihat instruksi deploy) dengan nama network
    # Docker yang dipakai project "master_db" di VPS — cek dengan `docker network ls`
    # dan `docker inspect master_postgresql`.
    name: ${MASTER_DB_NETWORK:-master_db_default}
