# VPS-level Nginx config (bukan container) — copy ke /etc/nginx/sites-available/bms-adb.conf
# lalu symlink ke sites-enabled. Lihat instruksi deploy di chat untuk langkah lengkap.
#
# Semua traffic publik diarahkan ke FE saja (port 3001, bound ke 127.0.0.1 di
# FE/docker-compose.yml). FE yang proxy ke BE secara internal lewat next.config.ts
# rewrites() — BE tidak pernah diexpose ke Nginx/publik. Yang di-rewrite: /api/auth/*, /api/backend/*
# (web) dan /api/v1/* (aplikasi mobile; header Authorization dan X-Real-IP diteruskan).

upstream bms_frontend {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;

    # Belum ada domain — pakai underscore (default catch-all) atau ganti dengan IP VPS.
    # Setelah punya domain, ganti jadi: server_name bms.example.com;
    server_name _;

    # Semua body API kecil (batas backend 64 KiB); tidak ada upload.
    client_max_body_size 1m;

    # --- IP klien asli untuk rate limiting backend (BE membaca X-Real-IP; lihat proxy_set_header di bawah) ---
    # Bila trafik datang lewat Cloudflare Tunnel (cloudflared di VPS -> Nginx), $remote_addr = 127.0.0.1 untuk SEMUA pengguna
    # dan rate limit akan menganggap semua orang satu IP. Aktifkan (uncomment) supaya Nginx memakai IP asli dari Cloudflare:
    #   set_real_ip_from 127.0.0.1;
    #   real_ip_header   CF-Connecting-IP;
    # (Hanya percaya header itu dari cloudflared lokal; jangan aktifkan bila Nginx terbuka langsung ke internet.)

    location / {
        proxy_pass http://bms_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade header untuk WebSocket — baru relevan kalau FE nanti konsumsi /ws
        # langsung dari browser (saat ini FE belum punya WS client, lihat README).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- SSL (Certbot / Let's Encrypt) ---
# Belum diaktifkan — belum ada domain. Setelah domain sudah diarahkan (DNS A record) ke VPS ini:
#   1. Ganti "server_name _;" di atas jadi domain Anda, reload Nginx.
#   2. sudo apt install certbot python3-certbot-nginx
#   3. sudo certbot --nginx -d your-domain.com
# Certbot otomatis menambahkan blok `listen 443 ssl;` + redirect HTTP->HTTPS ke file ini.
