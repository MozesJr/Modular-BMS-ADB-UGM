# Root orchestrator — gabungkan MQTT + BE + FE lewat include:
# Broker Mosquitto milik repo ini (MQTT/) IKUT dijalankan dan menjadi sumber kebenaran broker; BE mencapainya di
# bms-mqtt:1883 lewat network internal "bms-network". Port 1883 TIDAK dipublish ke host secara default.
# Untuk membuka ke ESP32 di internet (sementara, tanpa TLS): lihat MQTT/README.md dan MQTT/docker-compose.public.yml
#   docker compose -f docker-compose.yml -f MQTT/docker-compose.public.yml up -d
# Postgres tetap di luar repo (container "master_postgresql" di VPS, project "master_db").
#
# Prasyarat sebelum `docker compose up`:
#   1. docker network create bms-network          (sekali saja, kalau belum ada)
#   2. Set MASTER_DB_NETWORK di .env di folder ini, isi nama network Docker project
#      "master_db" di VPS (cek: docker network ls / docker inspect master_postgresql)
#   3. BE/.env.production dan FE/.env.production sudah diisi (cp dari *.env.production.example)
#   4. MQTT/secrets/password_file sudah dibuat:  MQTT/scripts/init-passwd.sh
include:
# MQTT/ sengaja tidak di-include: broker Mosquitto sudah jalan di VPS (project "master_db"),
# bukan container yang dikelola dari monorepo ini.
#
# Prasyarat sebelum `docker compose up`:
#   1. docker network create bms-network          (sekali saja, kalau belum ada)
#   2. Set MASTER_DB_NETWORK di .env di folder ini, isi nama network Docker project
#      "master_db" di VPS (cek: docker network ls / docker inspect master_postgresql)
#   3. BE/.env.production dan FE/.env.production sudah diisi (cp dari *.env.production.example)
include:
  - MQTT/docker-compose.yml
  - BE/docker-compose.yml
  - FE/docker-compose.yml
